# Deploys to Vercel on every push to `main`.
# Required repository secrets (Settings → Secrets and variables → Actions):
#   VERCEL_TOKEN        – https://vercel.com/account/tokens
#   VERCEL_ORG_ID       – from `vercel link` (.vercel/project.json) or the Vercel dashboard
#   VERCEL_PROJECT_ID   – same place
# And on the Vercel project itself set the env var DATABASE_URL (Production).
name: Deploy to Vercel

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: vercel-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm i -g vercel@latest
      - run: vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}
      - run: vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}
      - run: vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }}
